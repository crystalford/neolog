# Cloudflare configuration for the Neolog Next.js app.
#
# Deploy targets:
#   - Cloudflare Pages (Next.js frontend + API routes)
#   - Bindings to: D1, R2, Workers AI, the FFmpeg Container Worker (via service
#     binding), and Cloudflare Access (auth happens at edge before the request
#     hits the app — no app-side wiring beyond reading the JWT claims header).
#
# The Pages project is named "neolog". The custom domain is neolog.ai.
#
# After this file exists in the repo, the bootstrap workflow's deploy step
# will populate the Pages project and push the build artifacts.

name = "neolog"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Pages build output (used by @opennextjs/cloudflare adapter — see package.json)
pages_build_output_dir = ".vercel/output/static"

# ─── D1: relational database (SQLite) ───────────────────────────────────────
# database_id is filled in after the bootstrap workflow creates the DB.
# The bootstrap output prints the UUID; we copy it here in the same PR that
# adds the first data-layer code to make it official.
[[d1_databases]]
binding = "DB"
database_name = "neolog"
database_id = "d9db2aeb-c47b-4611-a2ba-96720939205b"

# ─── R2: video storage ──────────────────────────────────────────────────────
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "neolog-videos"

# ─── Workers AI: Whisper transcription, optional vision tagging ────────────
[ai]
binding = "AI"

# ─── Service binding to the FFmpeg Container Worker ────────────────────────
# Deployed separately from workers/ffmpeg. Once deployed, the main app calls
# env.FFMPEG.fetch(...) and Cloudflare routes to the container.
[[services]]
binding = "FFMPEG"
service = "neolog-ffmpeg"

# ─── Service binding to the process-upload Workflow Worker ─────────────────
# Pages projects can't bind workflows directly, so we use a Service binding
# to the workflow worker and its POST /dispatch endpoint creates the workflow
# instance. The main app calls env.PROCESS_UPLOAD.fetch('/dispatch', ...)
# to kick off transcribe + extraction pipelines.
[[services]]
binding = "PROCESS_UPLOAD"
service = "neolog-process-upload"

# ─── Service binding to the pipeline DO worker ──────────────────────────────
# The Pages /api/v2/vlogs/[id]/ws route proxies WebSocket upgrades to the
# VlogPipelineDO hosted in this worker. The workflow + container + extractor
# also POST per-step events to its /event/:vlog_id endpoint so live progress
# fans out to connected browsers in real time.
[[services]]
binding = "PIPELINE"
service = "neolog-pipeline"

# ─── Environment variables (non-secret) ─────────────────────────────────────
[vars]
NEOLOG_ENVIRONMENT = "production"
CLOUDFLARE_ACCESS_TEAM = "neolog"
CLOUDFLARE_ACCESS_AUD = ""   # filled in after Access app is created
R2_BUCKET_NAME = "neolog-videos"

# ─── Secrets (set via wrangler secret put or in Pages dashboard) ────────────
# ANTHROPIC_API_KEY — Claude calls for extraction / scripting / coherence-check
# CLOUDFLARE_R2_ACCESS_KEY_ID, CLOUDFLARE_R2_SECRET_ACCESS_KEY — for presigning
#   R2 URLs the browser uploads to (multipart) and the FFmpeg container reads from

# ─── Observability ──────────────────────────────────────────────────────────
[observability]
enabled = true
