<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1200"><title>neolog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="intake.css">
</head>
<body>
<div class="atm"></div>
<div class="grain"></div><div class="vig"></div>
<div class="top"><a class="lock" href="index.html"><span class="mk"></span><span class="wm">neolog</span></a><a class="tolog" href="log.html">the log</a></div>
<section class="stage">
  <div class="hint" id="hint">Talk, type, or drop something in. <kbd>↵</kbd> puts it in.</div>
  <div class="slab" id="slab"><i class="pulse"></i><span class="ack" id="ack">in</span><div class="in">
    <div class="att" id="att"></div>
    <span class="cnt" id="cnt"></span>
    <textarea id="in" rows="2"></textarea>
    <div class="bar">
      <button class="way" id="mic" data-n="talk"></button><span class="sep"></span>
      <label class="way" data-n="files"><input type="file" multiple></label>
      <label class="way" data-n="photos"><input type="file" accept="image/*,video/*" multiple></label>
      <button class="way" id="lnk" data-n="link"></button>
      <button class="way" id="cht" data-n="chat"></button>
      <button class="send" title="Put it in · Enter"></button>
    </div>
  </div></div>
</section>
</body></html>
