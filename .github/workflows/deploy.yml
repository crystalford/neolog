name: Fast deploy to Worker

# Fast path: build the Next.js app with the OpenNext Cloudflare adapter +
# deploy the Worker. Skips D1 schema apply, container worker rebuild,
# Access app config — all of which are handled by `bootstrap-cloudflare.yml`
# (workflow_dispatch only) when infra actually changes.
#
# This is what runs on every push to main OR the active claude/* feature
# branch. Total wall time ~60-90s.
#
# Trigger:
#   - push to main (auto)
#   - push to claude/integrate-filament-update-XWb1v (auto, solo-operator mode
#     where merge-to-main is unnecessary ceremony — we want to ship every push
#     straight to prod without a PR cycle)
#   - workflow_dispatch (manual, e.g. to redeploy current main)
#
# Required secrets (already configured for bootstrap-cloudflare.yml — same set):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# ⚠️ Deploy target changed from a Cloudflare Pages project to a Cloudflare
# Worker with static assets (the OpenNext Cloudflare adapter's model, not
# the deprecated @cloudflare/next-on-pages one). `wrangler.toml`'s bindings
# are read natively by `wrangler deploy` now — no more Pages-projects REST
# patch step, and no more Pages-preview R2 CORS entry.

on:
  push:
    branches: [main, claude/integrate-filament-update-XWb1v]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WORKER_NAME: neolog
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build with the OpenNext Cloudflare adapter
        run: npx opennextjs-cloudflare build

      - name: Deploy the Worker
        run: npx wrangler deploy

      - name: Push Worker secrets (idempotent)
        # A real prior incident, from the Pages era: bulk dispatch
        # (HEARTBEAT_TOKEN) and zombie termination (CLOUDFLARE_API_TOKEN)
        # secrets went missing between GitHub's copy and the deploy
        # target's, and the binding-check endpoint caught it as 503 on
        # every bulk-dispatch chunk. Re-asserting on every deploy is the
        # fix. `wrangler secret put` is idempotent — overwrites silently —
        # and reads the Worker name from wrangler.toml.
        run: |
          set -e
          if [ -n "$HEARTBEAT_TOKEN" ]; then
            echo "$HEARTBEAT_TOKEN" | npx wrangler secret put HEARTBEAT_TOKEN
          else
            echo "::warning::HEARTBEAT_TOKEN secret missing from GitHub repo — bulk dispatch will 503"
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CLOUDFLARE_API_TOKEN
          else
            echo "::warning::CLOUDFLARE_API_TOKEN missing — Workflow termination won't work"
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          fi
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID
            echo "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Fast deploy"
            echo ""
            echo "Worker: \`$WORKER_NAME\`"
            echo "Result: ${{ job.status }}"
            echo ""
            echo "For infra changes (D1 schema, container worker, custom domain, Access policy):"
            echo "run the **Bootstrap Cloudflare** workflow manually from the Actions tab."
          } >> "$GITHUB_STEP_SUMMARY"
