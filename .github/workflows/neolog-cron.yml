name: Neolog cron

on:
  schedule:
    # Only keep scheduled post publishing (core feature)
    - cron: '*/10 * * * *'   # publish-scheduled (every 10 min)
  workflow_dispatch: {}

concurrency:
  group: neolog-cron
  cancel-in-progress: true

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call publish-scheduled
        run: |
          curl -fsSL -H "Authorization: Bearer $CRON_SECRET" "$NEOLOG_BASE_URL/api/cron/publish-scheduled" || true
        env:
          NEOLOG_BASE_URL: ${{ secrets.NEOLOG_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

# DISABLED (not part of streamlined publishing vision):
# - rss-pull: Part of archived "monitors" feature
# - weekly-digest: Can re-enable later if needed
