name: Say what each recording is about

# The backfill, run from a runner instead of a browser.
#
# `POST /api/v2/admin/headlines` writes a bounded batch and says how many are
# left, so working through four hundred is the same call many times. Settings
# has a button that loops in the browser; this is the same loop somewhere the
# operator does not have to keep a tab open for.
#
# ⚠️ Read `src/lib/headline.ts` before changing anything here. A model
# writing a sentence is the thing this product refuses hardest, and the
# argument for why this one is allowed — it replaces a line the log already
# wrote, in the same slot, with the same attribution — is at the top of that
# file. Five different wrong lines reached the feed before the guards were
# right; they are all in `clean()` now, not in the prompt.
#
# Read-only against R2 and against every word he said. It writes one column,
# `vlogs.headline`, and nothing else.
#
# ⚠️ Do not run this while a deploy is in flight. The first two runs came
# back HTTP 404 with Next's own not-found page, on a path whose POST had
# worked a dozen times — and both had fired INSIDE a `deploy.yml` window
# (deploy 02:54:09–02:55:48, runs at 02:54:15 and 02:55:19). A Worker deploy
# swaps the bundle and its assets, and a request landing mid-swap gets a 404
# that reads exactly like a missing route. It cost half an hour of looking
# for a bug in a route that was fine.

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'How many batches of 10 to run (0 = until nothing is left)'
        default: '0'
      reclean:
        description: 'First, re-read every line already written against the current rules'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_ACCESS_CLIENT_ID:     ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      BASE_URL: https://neolog.ai
    steps:
      # ⚠️ Status and body, never a bare pipe into jq. The first run of
      # this died on "jq: parse error: Invalid numeric literal at line 1,
      # column 10" and threw away the thing that would have said why — the
      # exact failure this whole feature has been paying for: a silence with
      # no reason behind it. Whatever comes back gets printed.
      - name: Where it stands before
        run: |
          code=$(curl -s -S --max-time 60 -o /tmp/before.txt -w '%{http_code}' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$BASE_URL/api/v2/admin/headlines") || code=000
          echo "HTTP $code"
          if jq . /tmp/before.txt 2>/dev/null; then :; else
            echo "not JSON — the first 200 bytes of what came back:"
            head -c 200 /tmp/before.txt
            echo ""
          fi
          # ⚠️ Never fatal. This step only READS a count; the work is the next
          # one. A status query that fails should not stop four hundred
          # recordings being read — the same reason every rail card catches
          # its own error rather than taking the page down.
          exit 0

      - name: Work through them
        env:
          BATCHES: ${{ inputs.batches }}
          RECLEAN: ${{ inputs.reclean }}
        run: |
          set -o pipefail
          cap=${BATCHES:-0}
          # 0 means "until nothing is left". The ceiling is a runaway guard,
          # not a limit anyone should hit: 420 recordings is 42 batches.
          [ "$cap" -eq 0 ] && cap=80
          reclean_once=$RECLEAN
          written=0
          i=0

          while [ "$i" -lt "$cap" ]; do
            i=$((i + 1))
            body="{\"limit\":10}"
            # ⚠️ Only on the first call. `reclean` re-reads every stored line
            # against the current rules; doing it on every batch would be the
            # same full-table pass forty times for nothing.
            if [ "$reclean_once" = "true" ]; then
              body="{\"limit\":10,\"reclean\":true}"
              reclean_once=false
            fi

            code=$(curl -s -S --max-time 300 -X POST -o /tmp/batch.txt -w '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "$BASE_URL/api/v2/admin/headlines") || code=000
            out=$(cat /tmp/batch.txt 2>/dev/null || echo '')

            # ⚠️ A response that is not JSON is printed, not swallowed.
            if ! echo "$out" | jq -e . >/dev/null 2>&1; then
              echo "batch $i: HTTP $code, and not JSON. The first 600 bytes:"
              head -c 600 /tmp/batch.txt
              echo ""
              break
            fi

            w=$(echo "$out" | jq -r '.written // 0')
            n=$(echo "$out" | jq -r '.nothing // 0')
            left=$(echo "$out" | jq -r '.left // 0')
            written=$((written + w))

            echo "── batch $i · wrote $w · $n had nothing · $left to go"
            # Why, not just how many. A silence with no reason behind it is
            # the shape of bug this feature has already paid for twice.
            echo "$out" | jq -r '.why // {} | to_entries[] | "     \(.key): \(.value)"'
            echo "$out" | jq -r '.refused // [] | .[] | "     refused: \(.)"'
            # The lines themselves. A count cannot be checked; a sentence can.
            echo "$out" | jq -r '.lines // [] | .[:3] | .[] | "     \(.headline)"'

            if [ "$left" -eq 0 ]; then
              echo ""
              echo "Nothing left."
              break
            fi
            # A recording that produced nothing is stamped and will not come
            # back, so `left` always falls. If it does not, something is wrong
            # and looping would only burn model calls.
            if [ "$w" -eq 0 ] && [ "$n" -eq 0 ]; then
              echo "batch $i: nothing written and nothing refused — stopping"
              break
            fi
            sleep 2
          done

          echo ""
          echo "$written written over $i batches."

      - name: Where it stands after, and twenty of the lines
        if: always()
        run: |
          code=$(curl -s -S --max-time 60 -o /tmp/after.txt -w '%{http_code}' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$BASE_URL/api/v2/admin/headlines?sample=20") || code=000
          echo "HTTP $code"
          jq -r '"\(.with_words) transcribed · \(.written) with a line · \(.nothing_to_say) the log had nothing to say about · \(.left) to go", "", (.lines[] | "  \(.headline)")' /tmp/after.txt \
            || { echo "not JSON — the first 600 bytes:"; head -c 600 /tmp/after.txt; echo ""; }
