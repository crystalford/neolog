name: Bootstrap Cloudflare

# Provisions every Cloudflare resource Neolog needs:
#  - D1 database 'neolog' (created if absent)
#  - Schema applied (db/schema.sql)
#  - Initial prompt rows seeded (db/seed.sql)
#  - R2 bucket binding (neolog-videos — already exists, just confirms access)
#  - Workers AI binding
#  - Cloudflare Access application + One-time PIN identity provider
#  - Container Worker for FFmpeg deployed
#  - Pages project linked + production deploy
#
# Trigger: manually from github.com → Actions → Bootstrap Cloudflare → "Run workflow"
#
# Required secrets (set once via github.com → repo → Settings → Secrets and variables → Actions):
#  CLOUDFLARE_API_TOKEN   — token with Workers/D1/R2/Pages/Access edit permissions
#  CLOUDFLARE_ACCOUNT_ID  — eda2e9bbd9acc42699027cfdcb50f998
#  ANTHROPIC_API_KEY      — for the Worker's runtime calls (stored as a Worker secret at deploy time)
#  OPERATOR_EMAIL         — the email Cloudflare Access will send the one-time PIN to (your email)
#
# The workflow is idempotent. Safe to re-run after any change.

on:
  workflow_dispatch:
    inputs:
      reset_schema:
        description: "Drop and recreate D1 schema (DESTROYS all data — keep 'false' unless you mean it)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
  OPERATOR_EMAIL:        ${{ secrets.OPERATOR_EMAIL }}
  ACCESS_TEAM:           neolog
  R2_BUCKET:             neolog-videos
  D1_NAME:               neolog
  PAGES_PROJECT:         neolog
  CONTAINER_WORKER:      neolog-ffmpeg

jobs:
  bootstrap:
    name: Provision + deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify required secrets
        run: |
          set -e
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID secret}"
          : "${ANTHROPIC_API_KEY:?Missing ANTHROPIC_API_KEY secret}"
          : "${OPERATOR_EMAIL:?Missing OPERATOR_EMAIL secret}"
          echo "All required secrets present."

      - name: Verify Cloudflare API token works
        run: |
          set -e
          response=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "$body" | jq .
          if [ "$status" != "200" ]; then
            echo "❌ Token verify failed (HTTP $status)"
            exit 1
          fi
          echo "✅ Token valid."

      - name: Install pnpm deps (just wrangler — full install later if needed)
        run: |
          # Pin wrangler 4.x — Cloudflare Containers ([[containers]] array form)
          # requires v4. v3 rejects it with "containers should be an object".
          npm install -g wrangler@4
          wrangler --version

      - name: Create or confirm D1 database
        id: d1
        run: |
          set -e
          existing=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            | jq -r --arg name "$D1_NAME" '.result[] | select(.name == $name) | .uuid')

          if [ -z "$existing" ]; then
            echo "Creating D1 database '$D1_NAME'..."
            created=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"'$D1_NAME'"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
            existing=$(echo "$created" | jq -r '.result.uuid')
            echo "$created" | jq .
          else
            echo "D1 database '$D1_NAME' already exists: $existing"
          fi
          echo "uuid=$existing" >> "$GITHUB_OUTPUT"

      - name: Populate database_id in wrangler.toml files
        run: |
          set -e
          UUID="${{ steps.d1.outputs.uuid }}"
          echo "Stamping database_id = $UUID into wrangler.toml files..."
          # Replace any commented-out '# database_id' placeholder with the real id.
          # If the file already has a real assignment, replace it too (idempotent).
          stamp() {
            local f="$1"
            [ -f "$f" ] || return 0
            if grep -qE "^[[:space:]]*#?[[:space:]]*database_id" "$f"; then
              sed -i "s|^[[:space:]]*#\?[[:space:]]*database_id.*|database_id = \"$UUID\"|" "$f"
            else
              # No line present at all — insert one after database_name = "neolog"
              sed -i "/database_name = \"neolog\"/a database_id = \"$UUID\"" "$f"
            fi
            echo "--- $f (d1 section) ---"
            grep -A 4 "d1_databases" "$f" || true
          }
          stamp wrangler.toml
          stamp workers/process-upload/wrangler.toml

      - name: Optional — drop schema (destructive)
        if: ${{ inputs.reset_schema == 'true' }}
        run: |
          echo "⚠ reset_schema=true — dropping all tables in D1 '$D1_NAME'"
          # Generate drop statements from schema.sql tables
          tables=$(grep -oE "CREATE TABLE [a-z_]+" db/schema.sql | awk '{print $3}')
          drop_sql=$(for t in $tables; do echo "DROP TABLE IF EXISTS $t;"; done | tr '\n' ' ')
          wrangler d1 execute "$D1_NAME" --remote --command "$drop_sql"

      - name: Apply schema
        run: |
          set -e
          wrangler d1 execute "$D1_NAME" --remote --file db/schema.sql

      - name: Seed initial prompts (if seed file exists)
        run: |
          if [ -f db/seed.sql ]; then
            wrangler d1 execute "$D1_NAME" --remote --file db/seed.sql
          else
            echo "(no db/seed.sql yet — skipping)"
          fi

      - name: Confirm R2 bucket exists
        run: |
          set -e
          existing=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" \
            | jq -r --arg name "$R2_BUCKET" '.result.buckets[] | select(.name == $name) | .name')
          if [ -z "$existing" ]; then
            echo "❌ R2 bucket '$R2_BUCKET' not found. Existing videos should already live in this bucket."
            exit 1
          fi
          echo "✅ R2 bucket '$R2_BUCKET' confirmed."

      - name: Configure Cloudflare Access — One-time PIN identity provider
        run: |
          set -e
          # Check if a one-time-PIN IdP already exists
          existing=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/identity_providers" \
            | jq -r '.result[] | select(.type == "onetimepin") | .id')
          if [ -z "$existing" ]; then
            echo "Creating One-time PIN identity provider..."
            curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"One-time PIN","type":"onetimepin"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/identity_providers" \
              | jq .
          else
            echo "✅ One-time PIN identity provider already exists ($existing)."
          fi

      - name: Configure Cloudflare Access — application for neolog.ai
        run: |
          set -e
          # Check if an Access app for neolog.ai already exists
          existing=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" \
            | jq -r '.result[] | select(.domain == "neolog.ai") | .id')

          if [ -z "$existing" ]; then
            echo "Creating Access application for neolog.ai..."
            app_response=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Neolog",
                "domain": "neolog.ai",
                "type": "self_hosted",
                "session_duration": "720h",
                "auto_redirect_to_identity": false
              }' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps")
            echo "$app_response" | jq .
            app_id=$(echo "$app_response" | jq -r '.result.id')

            # Attach a policy that allows only the operator email
            echo "Creating allow-operator-only policy..."
            curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Operator only",
                "decision": "allow",
                "include": [{ "email": { "email": "'"$OPERATOR_EMAIL"'" } }]
              }' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$app_id/policies" \
              | jq .
          else
            echo "✅ Access application for neolog.ai already exists ($existing)."
          fi

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Generate R2 access key for presigning (if absent)
        id: r2_keys
        run: |
          set -e
          # Check if R2 access key secrets already exist on the Pages project.
          # If not, generate a new pair via the Cloudflare API and store them
          # as Workers secrets on all three projects (Pages, FFmpeg, Workflow).
          # The API does not let us list existing tokens, so we just check via
          # a placeholder file in R2 and assume the secret is already set if
          # we've ever run this step. Simplest: always generate fresh on
          # first run (the workflow is idempotent for everything else).
          # For now we leave this as a manual one-time step the operator does
          # in the dashboard (R2 → Manage API tokens → Create API token).
          # Once they paste R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY as GitHub
          # secrets, this step propagates them as Worker secrets below.
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "no_r2_keys=true" >> "$GITHUB_OUTPUT"
            echo "ℹ R2 presign keys not set as GitHub secrets — R2-presign features (browser multipart, container-side reads) will be unavailable until the operator adds R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY secrets. Bootstrap continues."
          else
            echo "no_r2_keys=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Deploy FFmpeg Container Worker (workers/ffmpeg)
        if: hashFiles('workers/ffmpeg/wrangler.toml') != ''
        run: |
          set -e
          cd workers/ffmpeg
          echo "Deploying neolog-ffmpeg Container Worker..."
          wrangler deploy

      - name: Deploy process-upload Workflow (workers/process-upload)
        if: hashFiles('workers/process-upload/wrangler.toml') != ''
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -e
          cd workers/process-upload
          echo "Deploying neolog-process-upload Workflow..."
          wrangler deploy
          # Push secrets the workflow needs at runtime
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "$R2_ACCESS_KEY_ID" | wrangler secret put R2_ACCESS_KEY_ID
            echo "$R2_SECRET_ACCESS_KEY" | wrangler secret put R2_SECRET_ACCESS_KEY
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "$ANTHROPIC_API_KEY" | wrangler secret put ANTHROPIC_API_KEY
          fi

      - name: Set Pages project Worker secrets
        if: hashFiles('wrangler.toml') != ''
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -e
          # Anthropic — runtime only, not used during bootstrap itself.
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "$ANTHROPIC_API_KEY" | wrangler pages secret put ANTHROPIC_API_KEY --project-name "$PAGES_PROJECT" || \
              echo "(Pages project does not exist yet — secret push deferred to next run.)"
          fi
          if [ -n "$R2_ACCESS_KEY_ID" ]; then
            echo "$R2_ACCESS_KEY_ID" | wrangler pages secret put R2_ACCESS_KEY_ID --project-name "$PAGES_PROJECT" || true
            echo "$R2_SECRET_ACCESS_KEY" | wrangler pages secret put R2_SECRET_ACCESS_KEY --project-name "$PAGES_PROJECT" || true
          fi

      - name: Build + deploy Pages project
        if: hashFiles('wrangler.toml') != '' && hashFiles('next.config.js') != ''
        run: |
          set -e
          # next-on-pages builds the Next.js app to a Workers-runtime bundle
          npx @cloudflare/next-on-pages
          wrangler pages deploy .vercel/output/static --project-name "$PAGES_PROJECT" --branch main

      - name: Summary
        run: |
          {
            echo "## Bootstrap complete"
            echo ""
            echo "- D1 database: \`$D1_NAME\` (id: ${{ steps.d1.outputs.uuid }})"
            echo "- R2 bucket: \`$R2_BUCKET\` confirmed"
            echo "- Access app: neolog.ai configured for \`$OPERATOR_EMAIL\`"
            echo "- Schema applied from \`db/schema.sql\`"
            if [ -f workers/ffmpeg/wrangler.toml ]; then
              echo "- FFmpeg Container Worker deployed"
            fi
            if [ -f workers/process-upload/wrangler.toml ]; then
              echo "- process-upload Workflow deployed"
            fi
            if [ -f next.config.js ]; then
              echo "- Pages project \`$PAGES_PROJECT\` built + deployed"
            fi
            echo ""
            echo "Next: visit neolog.ai (when DNS is pointed) and sign in via Cloudflare Access."
          } >> $GITHUB_STEP_SUMMARY
