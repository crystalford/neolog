name: Deploy workers

# Auto-deploy the FFmpeg container worker and the process-upload workflow
# worker on push to main when their files change. Closes the gap between
# deploy.yml (Pages only) and bootstrap-cloudflare.yml (manual full infra).
#
# Why this exists: before this workflow, code changes to workers/* only
# reached production when the operator manually ran "Bootstrap Cloudflare".
# That meant fixes pushed to main sat dormant — including the thumbnail
# improvements that should have unblocked the "Fix all thumbnails" feature.
#
# Triggers:
#   - push to main with changes under workers/**
#   - workflow_dispatch (manual)
#
# Both jobs always run when the workflow triggers. wrangler deploy is
# idempotent and fast for unchanged code (~30s), so over-deploying is
# cheap. Keeps the workflow simple.
#
# Required secrets (same set bootstrap-cloudflare.yml uses):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

jobs:
  deploy-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install wrangler
        run: pnpm add -g wrangler@4
      - name: Deploy FFmpeg container worker
        if: hashFiles('workers/ffmpeg/wrangler.toml') != ''
        run: |
          set -e
          cd workers/ffmpeg
          # @cloudflare/containers must be resolvable for wrangler bundle.
          npm install --no-audit --no-fund
          wrangler deploy
      - name: Summary
        if: always()
        run: |
          {
            echo "## FFmpeg container worker"
            echo ""
            echo "Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-process-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install wrangler
        run: pnpm add -g wrangler@4
      - name: Deploy process-upload workflow worker
        if: hashFiles('workers/process-upload/wrangler.toml') != ''
        run: |
          set -e
          cd workers/process-upload
          # Install if there's a package.json (matches bootstrap behavior — the
          # worker bundles a few @cloudflare/* packages that wrangler needs to
          # resolve at deploy time).
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          fi
          wrangler deploy
          # Push runtime secrets the workflow uses (idempotent — wrangler
          # secret put overwrites). Quietly skip if the secret isn't set.
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            echo "$R2_ACCESS_KEY_ID" | wrangler secret put R2_ACCESS_KEY_ID
            echo "$R2_SECRET_ACCESS_KEY" | wrangler secret put R2_SECRET_ACCESS_KEY
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "$ANTHROPIC_API_KEY" | wrangler secret put ANTHROPIC_API_KEY
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "## process-upload workflow worker"
            echo ""
            echo "Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
