name: Screenshots

# Look at the deployed site.
#
# The operator: "the whole site still looks like a frankenstein patchwork of
# bubble gum and duct tape." CLAUDE.md's own rule is "look at the page before
# changing its CSS" — and this session cannot: neolog.ai is behind Access and
# the sandbox has no egress to it. A runner has both, so it drives a real
# browser with the Access service-token headers and commits the frames back
# into the repo, where they can be read.
#
# `ops/shots/` is disposable. Delete it when the look has been settled.

on:
  workflow_dispatch:
    inputs:
      width:
        description: 'Viewport width'
        default: '1440'

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: Install Playwright
        run: npm i -D playwright@1.49.0 && npx playwright install chromium --with-deps

      - name: Shoot the surfaces
        env:
          CF_ACCESS_CLIENT_ID:     ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          WIDTH: ${{ inputs.width }}
        run: |
          mkdir -p ops/shots
          # ⚠️ In the workspace, not /tmp — node resolves `playwright` from
          # the importing file's directory, and it is installed here.
          cat > shoot.mjs <<'JS'
          import { chromium } from 'playwright'

          const BASE = 'https://neolog.ai'
          const W = parseInt(process.env.WIDTH || '1440', 10)

          // The surfaces he actually moves between. First screen only —
          // that is what "looks like" means.
          const PAGES = [
            ['home',        '/'],
            ['recordings',  '/vlogs'],
            ['settings',    '/settings'],
            ['search',      '/search'],
            ['facts',       '/facts'],
            ['export',      '/export'],
            ['corrections', '/corrections'],
            ['writing',     '/writing'],
            ['footage',     '/footage'],
            ['clear',       '/clear'],
            ['triage',      '/triage'],
            ['everything',  '/everything'],
            ['messages',    '/messages'],
            ['screenshots', '/screenshots'],
            ['pages',       '/pages'],
            ['now',         '/now'],
          ]

          const browser = await chromium.launch()
          const ctx = await browser.newContext({
            viewport: { width: W, height: 900 },
            deviceScaleFactor: 1,
            extraHTTPHeaders: {
              'CF-Access-Client-Id': process.env.CF_ACCESS_CLIENT_ID,
              'CF-Access-Client-Secret': process.env.CF_ACCESS_CLIENT_SECRET,
            },
          })
          const page = await ctx.newPage()

          for (const [name, path] of PAGES) {
            try {
              await page.goto(BASE + path, { waitUntil: 'networkidle', timeout: 60000 })
              await page.waitForTimeout(1200)
              await page.screenshot({ path: `ops/shots/${name}.png` })
              console.log('shot', name)
            } catch (err) {
              console.log('FAILED', name, err.message)
            }
          }

          // The uploader, open — it is behind a button, so nothing else sees it.
          try {
            await page.goto(BASE + '/vlogs', { waitUntil: 'networkidle', timeout: 60000 })
            await page.getByRole('button', { name: /put recordings in/i }).click()
            await page.waitForTimeout(1200)
            await page.screenshot({ path: 'ops/shots/uploader.png' })
            console.log('shot uploader')
          } catch (err) {
            console.log('FAILED uploader', err.message)
          }

          await browser.close()
          JS
          node shoot.mjs
          rm -f shoot.mjs
          ls -la ops/shots/

      - name: Commit the frames
        run: |
          git config user.name  "neolog-shot-bot"
          git config user.email "bot@neolog.ai"
          git add ops/shots
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "shots: the deployed site, for looking at [skip ci]"
            git push origin main
          fi
