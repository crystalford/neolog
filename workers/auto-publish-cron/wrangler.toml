# Cloudflare Cron Trigger: auto-publish sweep
#
# Fires the Pages app's /api/v2/refresh-drafts endpoint on a schedule so
# auto_publish_pending vlogs get swept (top clips judged, sliced,
# captioned, fanned out to social) without requiring the operator to
# open the home page.
#
# Auth: shared secret in the X-Cron-Secret header. The refresh-drafts
# route bypasses requireOperator when this secret matches AND the
# request carries ?operator_id=... ; otherwise normal Access JWT auth
# applies. Set CRON_SECRET via `wrangler secret put` on both this
# worker and the Pages project.

name = "neolog-auto-publish-cron"
main = "src/index.ts"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]
account_id = "eda2e9bbd9acc42699027cfdcb50f998"

[triggers]
# Every 10 minutes. At that cadence a vlog uploaded mid-cycle hits the
# social feeds within ~10 minutes of extraction finishing — fast enough
# for "walk away" UX, conservative enough for invocation cost (4,320
# invocations/month, negligible on Cloudflare's free quota).
crons = ["*/10 * * * *"]

[vars]
# Base URL of the Pages app. Override per-environment if needed.
PAGES_BASE_URL = "https://neolog.ai"
