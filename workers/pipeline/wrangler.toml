# Cloudflare Worker: neolog-pipeline
#
# Hosts VlogPipelineDO — one Durable Object per vlog.
#
# Responsibilities:
#   1. Drive the 3-step pipeline (audio_extract → transcribe → read) via
#      alarm-scheduled execution. Each step is durably checkpointed in DO
#      storage; the DO hibernates between events to avoid billing while idle.
#   2. Skip-if-exists guards on every step keyed on R2 artifacts + D1 state.
#      Replay a single step (force=true) without re-running upstream work.
#   3. Per-step retry with exponential backoff. After max attempts the row
#      transitions to state='failed' with full untruncated error text.
#      ⚠️ Nothing re-dispatches it after that on a schedule — the healer's
#      cron is off. The button is /settings → "wedged half-way".
#   4. Receive container heartbeats (POST /event) and broadcast to any
#      connected browser WebSocket on /ws/:vlog_id so the operator sees
#      byte-level progress in real time.
#
# Bindings:
#   DB              — D1 (vlogs, transcript_words, log_entries, pipeline_events)
#   VIDEOS          — R2 (source video, audio chunks/mp3)
#   AI              — Workers AI (Whisper). Nothing else: the last step calls
#                     no model.
#   FFMPEG          — service binding to neolog-ffmpeg
#
# Secrets:
#   HEARTBEAT_TOKEN — shared with workflow + container; gates POST /event
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY — for presigning R2 GET URLs
#
# ⚠️ ANTHROPIC_API_KEY was listed here as "the Sonnet escalation path". There
# is no escalation path and nothing on this worker reads that key. Anthropic
# is a paid opt-in the operator has not taken.
#
# Vars:
#   CLOUDFLARE_ACCOUNT_ID, R2_BUCKET_NAME, PIPELINE_URL

name = "neolog-pipeline"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "eda2e9bbd9acc42699027cfdcb50f998"

[[d1_databases]]
binding = "DB"
database_name = "neolog"
database_id = "d9db2aeb-c47b-4611-a2ba-96720939205b"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "neolog-videos"

[ai]
binding = "AI"

[[services]]
binding = "FFMPEG"
service = "neolog-ffmpeg"

[[durable_objects.bindings]]
name = "PIPELINE_DO"
class_name = "VlogPipelineDO"

# Singleton DO that gates FFmpeg container calls. The FFmpeg worker has
# max_instances=5; without this gate, simultaneous bulk dispatches burst
# the container pool and 503 on instances 6+. The pipeline DO acquires
# a token before calling env.FFMPEG.fetch and releases it after.
[[durable_objects.bindings]]
name = "FFMPEG_GATE"
class_name = "FFmpegGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VlogPipelineDO"]

[[migrations]]
tag = "v2"
new_classes = ["LlamaGate"]

[[migrations]]
tag = "v3"
new_classes = ["FFmpegGate"]

# v4 created KimiGate during the multi-LLM detour. It was already
# applied server-side before we rolled back, so the entry has to stay
# here for wrangler's migration history to remain continuous —
# removing it makes wrangler try to re-apply earlier migrations like
# v1's new_sqlite_classes, which fails because VlogPipelineDO already
# exists with data. v5 below deletes the class cleanly.
[[migrations]]
tag = "v4"
new_classes = ["KimiGate"]

# v5 reverses v4. Drops the KimiGate class since we're back to
# Llama-only after the multi-LLM detour didn't help.
[[migrations]]
tag = "v5"
deleted_classes = ["KimiGate"]

# v6 drops LlamaGate. It gated the extraction engine's Llama calls, and
# `src/lib/extract-unified.ts` — the only caller, named in the class's own
# comment — went with the video-essay studio on 8 Sep. The class sat
# deployed and bound with nothing reaching it. Deleted here the same way
# v5 deleted KimiGate: the earlier tags stay so wrangler's history stays
# continuous and it does not retry v1 against a VlogPipelineDO that
# already holds data.
[[migrations]]
tag = "v6"
deleted_classes = ["LlamaGate"]

[vars]
CLOUDFLARE_ACCOUNT_ID = "eda2e9bbd9acc42699027cfdcb50f998"
R2_BUCKET_NAME = "neolog-videos"
PIPELINE_URL = "https://neolog-pipeline.eda2e9bbd9acc42699027cfdcb50f998.workers.dev"
# Hard cap on concurrent FFmpeg container calls. The container worker
# has max_instances=5, so we leave 2 instances of headroom for thumbnail
# / transcode work from the legacy workflow. Default 3.
FFMPEG_GATE_CONCURRENCY = "3"

[observability]
enabled = true
