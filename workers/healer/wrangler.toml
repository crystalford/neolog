# Cloudflare Worker: healer
#
# Sweeps stuck pipeline rows. When a vlog has been in transcoding /
# transcribing / extracting / reading for > 10 minutes (a healthy pipeline
# checkpoints inside that window), it re-dispatches. After MAX_RESTARTS on
# the same row it marks the row failed instead of looping forever.
#
# ⚠️ The cron is OFF (below), so this only runs when its fetch handler is
# called. The operator-facing form of the same job is the "wedged half-way"
# button on /settings, which calls POST /api/v2/admin/reset-stuck.
#
# `/uploads` — which this file used to point at for the "Needs attention"
# signal — was removed on 8 Sep.
#
# Bindings:
#   DB              — D1 database 'neolog'
#   PROCESS_UPLOAD  — Service binding to the workflow worker

name = "neolog-healer"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "eda2e9bbd9acc42699027cfdcb50f998"

[triggers]
# Cron DISABLED. Was */5 = 8,640 invocations/month — pure ambient cost on a
# single-operator app where genuinely-stuck workflows are rare.
#
# ⚠️ That trade is right for a quiet log and wrong for the one event this
# product is built around: four hundred recordings through FFmpeg and
# Whisper, where a stuck row is not rare. Turning it back on for the duration
# of that run is one line here and the operator's call — it is his bill.
# Until then the job is the "wedged half-way" button on /settings.
crons = []

[[d1_databases]]
binding = "DB"
database_name = "neolog"
database_id = "d9db2aeb-c47b-4611-a2ba-96720939205b"

[[services]]
binding = "PROCESS_UPLOAD"
service = "neolog-process-upload"

# Prefer the DO pipeline; PROCESS_UPLOAD is the fallback for legacy rows.
[[services]]
binding = "PIPELINE"
service = "neolog-pipeline"

[observability]
enabled = true
